name: Browser and MCP checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Linux browser namespaces
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Applies only to this disposable CI runner, not an installation step.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          echo "MOLI_PYTHON=$(python -c 'import sys;print(sys.executable)')" >> "$GITHUB_ENV"
      - name: Windows supervisor executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pythonExecutable = python -c 'import sys;print(sys.executable)'
          "MOLI_PYTHON=$pythonExecutable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: npm run setup
      - run: npm test
      - name: Build and inspect packages
        run: |
          python scripts/package.py
          python scripts/check-release.py
      - name: Test a clean runtime extraction
        run: python scripts/check-release.py --smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: checks-${{ runner.os }}
          path: dist/release-check.json
